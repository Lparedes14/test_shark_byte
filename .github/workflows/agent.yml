# Thin trigger for a project repo. The orchestrator code lives only in home base
# (sharkbyte_hackathon); this workflow checks it out at run time, so a fix there applies
# to every project at once.

name: agent

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: agent-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run:
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get the orchestrator from home base
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sharkbyte_hackathon
          path: home
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r home/requirements.txt
      - name: Run the orchestrator
        run: python home/orchestrator/main.py
        env:
          ORCH_CONTEXT: project
          SWARMS_API_KEY: ${{ secrets.SWARMS_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_LEAD_WEBHOOK: ${{ secrets.PROJECT_LEAD_WEBHOOK }}
          PROJECT_LEAD_WEBHOOK_KEY: ${{ secrets.PROJECT_LEAD_WEBHOOK_KEY }}
          PROGRESS_REPORTER_WEBHOOK: ${{ secrets.PROGRESS_REPORTER_WEBHOOK }}
          PROGRESS_REPORTER_WEBHOOK_KEY: ${{ secrets.PROGRESS_REPORTER_WEBHOOK_KEY }}
          QA_TESTER_WEBHOOK: ${{ secrets.QA_TESTER_WEBHOOK }}
          QA_TESTER_WEBHOOK_KEY: ${{ secrets.QA_TESTER_WEBHOOK_KEY }}
      - name: Save the raw agent output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-output
          path: .orchestrator-runs/
          if-no-files-found: ignore
